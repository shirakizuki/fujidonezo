<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Test</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="p-8 bg-gray-100">
    <h1 class="text-2xl font-bold mb-4">Color Grid Test</h1>
    
    <div class="bg-white rounded shadow-lg p-4 w-72 border border-gray-200">
        <p class="text-sm font-medium text-gray-700 mb-3">Select Course Color</p>
        <div class="grid grid-cols-5 gap-3 mb-4" style="display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px;">
            <!-- Row 1 -->
            <div class="w-8 h-8 bg-red-700 rounded cursor-pointer hover:ring-2 hover:ring-offset-1 hover:ring-gray-400 transition-all duration-200" style="width: 32px; height: 32px;"></div>
            <div class="w-8 h-8 bg-red-500 rounded cursor-pointer hover:ring-2 hover:ring-offset-1 hover:ring-gray-400 transition-all duration-200" style="width: 32px; height: 32px;"></div>
            <div class="w-8 h-8 bg-pink-500 rounded cursor-pointer hover:ring-2 hover:ring-offset-1 hover:ring-gray-400 transition-all duration-200" style="width: 32px; height: 32px;"></div>
            <div class="w-8 h-8 bg-purple-500 rounded cursor-pointer hover:ring-2 hover:ring-offset-1 hover:ring-gray-400 transition-all duration-200" style="width: 32px; height: 32px;"></div>
            <div class="w-8 h-8 bg-indigo-500 rounded cursor-pointer hover:ring-2 hover:ring-offset-1 hover:ring-gray-400 transition-all duration-200" style="width: 32px; height: 32px;"></div>
            
            <!-- Row 2 -->
            <div class="w-8 h-8 bg-blue-700 rounded cursor-pointer hover:ring-2 hover:ring-offset-1 hover:ring-gray-400 transition-all duration-200" style="width: 32px; height: 32px;"></div>
            <div class="w-8 h-8 bg-blue-500 rounded cursor-pointer hover:ring-2 hover:ring-offset-1 hover:ring-gray-400 transition-all duration-200" style="width: 32px; height: 32px;"></div>
            <div class="w-8 h-8 bg-cyan-500 rounded cursor-pointer hover:ring-2 hover:ring-offset-1 hover:ring-gray-400 transition-all duration-200" style="width: 32px; height: 32px;"></div>
            <div class="w-8 h-8 bg-teal-500 rounded cursor-pointer hover:ring-2 hover:ring-offset-1 hover:ring-gray-400 transition-all duration-200" style="width: 32px; height: 32px;"></div>
            <div class="w-8 h-8 bg-green-500 rounded cursor-pointer hover:ring-2 hover:ring-offset-1 hover:ring-gray-400 transition-all duration-200" style="width: 32px; height: 32px;"></div>
            
            <!-- Row 3 -->
            <div class="w-8 h-8 bg-green-600 rounded cursor-pointer hover:ring-2 hover:ring-offset-1 hover:ring-gray-400 transition-all duration-200" style="width: 32px; height: 32px;"></div>
            <div class="w-8 h-8 bg-yellow-600 rounded cursor-pointer hover:ring-2 hover:ring-offset-1 hover:ring-gray-400 transition-all duration-200" style="width: 32px; height: 32px;"></div>
            <div class="w-8 h-8 bg-orange-500 rounded cursor-pointer hover:ring-2 hover:ring-offset-1 hover:ring-gray-400 transition-all duration-200" style="width: 32px; height: 32px;"></div>
            <div class="w-8 h-8 bg-orange-600 rounded cursor-pointer hover:ring-2 hover:ring-offset-1 hover:ring-gray-400 transition-all duration-200" style="width: 32px; height: 32px;"></div>
            <div class="w-8 h-8 bg-pink-400 rounded cursor-pointer hover:ring-2 hover:ring-offset-1 hover:ring-gray-400 transition-all duration-200" style="width: 32px; height: 32px;"></div>
        </div>
        <div class="mb-3">
            <input type="text" placeholder="#efefef" class="w-full p-2 text-sm border rounded focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
        <div class="flex justify-between">
            <button class="px-4 py-1 bg-gray-200 hover:bg-gray-300 rounded text-sm transition-colors duration-200">Cancel</button>
            <button class="px-4 py-1 bg-blue-600 hover:bg-blue-700 text-white rounded text-sm transition-colors duration-200">Apply</button>
        </div>
    </div>
</body>
</html>
