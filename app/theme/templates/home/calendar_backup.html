{% extends './home.html' %}
{% load static %}
{% load tailwind_tags %}
{% block main %}
<div class="flex w-full overflow-hidden">
    <!-- Main calendar area -->
    <div class="flex-1 p-3 md:px-4 md:py-5 lg:px-6 lg:py-6 overflow-y-auto">
        <!-- Top navigation bar -->
        <div class="flex justify-between items-center mb-6 border-b pb-4">
            <!-- Left side: Today button and month navigation -->
            <div class="flex items-center space-x-4">
                <button id="today-btn" class="px-4 py-2 border border-gray-300 rounded-md text-sm hover:bg-gray-100">Today</button>
                <div class="flex items-center space-x-2">
                    <button id="prev-month" class="p-2 rounded-full hover:bg-gray-100">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                            <path fill-rule="evenodd" d="M12.707 5.293a1 1 0 010 1.414L9.414 10l3.293 3.293a1 1 0 01-1.414 1.414l-4-4a1 1 0 010-1.414l4-4a1 1 0 011.414 0z" clip-rule="evenodd" />
                        </svg>
                    </button>
                    <button id="next-month" class="p-2 rounded-full hover:bg-gray-100">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                            <path fill-rule="evenodd" d="M7.293 14.707a1 1 0 010-1.414L10.586 10 7.293 6.707a1 1 0 011.414-1.414l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0z" clip-rule="evenodd" />
                        </svg>
                    </button>
                    <h1 class="text-xl font-medium" id="calendar-header">May 2025</h1>
                </div>
            </div>

            <!-- Right side: View options -->
            <div class="flex items-center">
                <div class="border rounded-md overflow-hidden">
                    <button class="px-4 py-2 text-sm bg-gray-50 hover:bg-gray-100 border-r">Week</button>
                    <button class="px-4 py-2 text-sm bg-gray-300 hover:bg-gray-300 font-medium">Month</button>
                    <button class="px-4 py-2 text-sm bg-gray-50 hover:bg-gray-100 border-l">Agenda</button>
                </div>
                <button class="ml-2 p-2 rounded-full hover:bg-gray-100">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd" d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z" clip-rule="evenodd" />
                    </svg>
                </button>
            </div>
        </div>

        <!-- Calendar container -->
        <div class="bg-white rounded-lg shadow-md">
            <!-- Weekday headers -->
            <div class="grid grid-cols-7 border-b text-center py-2 font-medium text-gray-500">
                <div>SUN</div>
                <div>MON</div>
                <div>TUE</div>
                <div>WED</div>
                <div>THU</div>
                <div>FRI</div>
                <div>SAT</div>
            </div>
            
            <!-- Calendar grid -->
            <div id="calendar-grid" class="grid grid-cols-7 border-b border-gray-200">
                <!-- Calendar cells will be generated by JavaScript -->
            </div>
        </div>
    </div>
    
    <!-- Sidebar -->
    <div class="hidden md:block w-72 border-l p-4 bg-white">
        <!-- Mini calendar -->
        <div class="mb-4">
            <div class="flex justify-between items-center mb-2">
                <button id="mini-prev-month" class="p-1 hover:bg-gray-100 rounded-full">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd" d="M12.707 5.293a1 1 0 010 1.414L9.414 10l3.293 3.293a1 1 0 01-1.414 1.414l-4-4a1 1 0 010-1.414l4-4a1 1 0 011.414 0z" clip-rule="evenodd" />
                    </svg>
                </button>
                <div id="mini-calendar-header" class="text-sm font-medium">May 2025</div>
                <button id="mini-next-month" class="p-1 hover:bg-gray-100 rounded-full">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd" d="M7.293 14.707a1 1 0 010-1.414L10.586 10 7.293 6.707a1 1 0 011.414-1.414l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0z" clip-rule="evenodd" />
                    </svg>
                </button>
            </div>
            <div class="grid grid-cols-7 gap-1 text-center text-xs">
                <div>S</div>
                <div>M</div>
                <div>T</div>
                <div>W</div>
                <div>T</div>
                <div>F</div>
                <div>S</div>
            </div>
            <div id="mini-calendar-grid" class="grid grid-cols-7 gap-1 mt-1">
                <!-- Mini calendar cells will be generated by JavaScript -->
            </div>
        </div>

        <!-- Calendars section -->
        <div class="mb-4">
            <div class="flex items-center justify-between mb-2">
                <h3 class="text-sm font-medium text-gray-700 flex items-center">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-1 transform rotate-90" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd" />
                    </svg>
                    CALENDARS
                </h3>
            </div>
            <div id="calendars-list" class="space-y-2">
                <!-- Calendar list will be populated by JS -->
            </div>
        </div>

        <!-- Other calendars section -->
        <div>
            <div class="flex items-center justify-between mb-2">
                <h3 class="text-sm font-medium text-gray-700 flex items-center">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-1 transform rotate-90" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd" />
                    </svg>
                    OTHER
                </h3>
            </div>
            <div class="text-right text-sm text-blue-600 hover:underline">
                <a href="#" id="calendar-feed-link">Calendar Feed</a>
            </div>
        </div>
    </div>

    <!-- Task detail modal -->
    <div id="task-detail-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center">
        <div class="bg-white rounded-lg shadow-xl w-full max-w-md mx-4 overflow-hidden">
            <div class="p-4 border-b">
                <h3 id="task-detail-title" class="text-lg font-semibold"></h3>
            </div>
            <div class="p-4 space-y-3">
                <div id="task-detail-time" class="text-sm text-gray-500"></div>
                <p id="task-detail-description" class="text-gray-700"></p>
                <div id="task-detail-status" class="mt-4"></div>
            </div>
            <div class="p-4 bg-gray-50 flex justify-end space-x-2">
                <button id="close-task-detail" class="px-4 py-2 bg-gray-200 hover:bg-gray-300 rounded-md">Close</button>
                <button id="edit-task-detail" class="px-4 py-2 bg-orange-400 hover:bg-orange-500 text-white rounded-md">Edit</button>
            </div>
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        // Calendar data from backend
        const calendarTasks = JSON.parse('{{ calendar_tasks|safe }}');
        const today = "{{ today }}";
        let currentMonth = parseInt("{{ current_month }}", 10);
        let currentYear = parseInt("{{ current_year }}", 10);
        
        // DOM elements
        const calendarGrid = document.getElementById('calendar-grid');
        const calendarHeader = document.getElementById('calendar-header');
        const prevMonthBtn = document.getElementById('prev-month');
        const nextMonthBtn = document.getElementById('next-month');
        const todayBtn = document.getElementById('today-btn');
        const taskDetailModal = document.getElementById('task-detail-modal');
        const closeTaskDetailBtn = document.getElementById('close-task-detail');
        const miniCalendarGrid = document.getElementById('mini-calendar-grid');
        const miniCalendarHeader = document.getElementById('mini-calendar-header');
          // Month names for header
        const monthNames = ["January", "February", "March", "April", "May", "June",
                           "July", "August", "September", "October", "November", "December"];
                           
        // Sample calendar categories for the sidebar
        const calendarCategories = [
            { name: "MATT ALEXIUS MERANO", color: "blue" },
            { name: "27600-AUTOMATA & LANGUAGE THEORY", color: "green" },
            { name: "27608-INFORMATION ASSURANCE & SECURITY", color: "pink" },
            { name: "27624-COMP. ORGANIZATION & ASSEMBLY LANG.", color: "teal" },
            { name: "27632-TECHNOPRENEURSHIP", color: "yellow" },
            { name: "27640-CS ELECTIVE 2", color: "purple" }
        ];
        
        // Initialize the calendar categories in sidebar
        function initializeCalendarSidebar() {
            const calendarsList = document.getElementById('calendars-list');
            calendarsList.innerHTML = '';
            
            calendarCategories.forEach(cat => {
                const calItem = document.createElement('div');
                calItem.className = 'flex items-center justify-between';
                
                const colorDot = document.createElement('div');
                const colorClass = getColorClass(cat.color);
                
                calItem.innerHTML = `
                    <div class="flex items-center">
                        <span class="w-3 h-3 rounded-full ${colorClass} mr-2"></span>
                        <span class="text-sm">${cat.name}</span>
                    </div>
                    <button class="p-1 text-gray-400 hover:text-gray-600">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor">
                            <path d="M6 10a2 2 0 11-4 0 2 2 0 014 0zM12 10a2 2 0 11-4 0 2 2 0 014 0zM16 12a2 2 0 100-4 2 2 0 000 4z" />
                        </svg>
                    </button>
                `;
                
                calendarsList.appendChild(calItem);
            });
        }
        
        // Get tailwind color class from color name
        function getColorClass(color) {
            const colorMap = {
                'blue': 'bg-blue-500',
                'green': 'bg-green-500',
                'pink': 'bg-pink-500',
                'teal': 'bg-teal-500',
                'yellow': 'bg-yellow-500',
                'purple': 'bg-purple-500',
            };
            
            return colorMap[color] || 'bg-gray-500';
        }
        
        // Generate and render mini calendar for sidebar
        function renderMiniCalendar(month, year) {
            const miniCalendarGrid = document.getElementById('mini-calendar-grid');
            const miniCalendarHeader = document.getElementById('mini-calendar-header');
            
            if (!miniCalendarGrid || !miniCalendarHeader) return;
            
            // Clear the grid
            miniCalendarGrid.innerHTML = '';
            
            // Update the header
            miniCalendarHeader.textContent = `${monthNames[month - 1]} ${year}`;
            
            // Get first day of month and last day
            const firstDay = new Date(year, month - 1, 1);
            const lastDay = new Date(year, month, 0);
            const daysInMonth = lastDay.getDate();
            
            // Get day of week (0 = Sunday)
            let firstDayOfWeek = firstDay.getDay();
            
            // Create empty cells for days before first day of month
            for (let i = 0; i < firstDayOfWeek; i++) {
                const cell = document.createElement('div');
                cell.className = 'h-6 w-6';
                miniCalendarGrid.appendChild(cell);
            }
            
            // Create cells for each day in month
            for (let day = 1; day <= daysInMonth; day++) {
                const cell = document.createElement('div');
                
                // Format date string to match backend format (YYYY-MM-DD)
                const dateString = `${year}-${String(month).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                const isToday = dateString === today;
                const hasEvents = calendarTasks[dateString] && calendarTasks[dateString].length > 0;
                
                let cellClasses = 'h-6 w-6 flex items-center justify-center text-xs rounded-full cursor-pointer';
                
                if (isToday) {
                    cellClasses += ' bg-blue-500 text-white font-medium';
                } else if (hasEvents) {
                    cellClasses += ' font-medium text-blue-700';
                } else {
                    cellClasses += ' hover:bg-gray-100';
                }
                
                cell.className = cellClasses;
                cell.textContent = day;
                cell.setAttribute('data-date', dateString);
                
                // Add click event
                cell.addEventListener('click', function() {
                    // Highlight selected date in main calendar
                    const dateToSelect = this.getAttribute('data-date');
                    highlightDate(dateToSelect);
                });
                
                miniCalendarGrid.appendChild(cell);
            }
        }
        
        // Function to highlight a specific date in the main calendar
        function highlightDate(dateString) {
            // Implementation would depend on your navigation needs
            // For now, just log the date
            console.log('Selected date:', dateString);
            
            // Future enhancement: scroll to the date in the main calendar
            // Or switch to day view showing only this date
        }
        
        // Generate and render main calendar
        function renderCalendar(month, year) {
            // Clear the grid
            calendarGrid.innerHTML = '';
            
            // Update the header
            calendarHeader.textContent = `${monthNames[month - 1]} ${year}`;
            
            // Also update mini calendar in sidebar
            renderMiniCalendar(month, year);
            
            // Get first day of month and last day
            const firstDay = new Date(year, month - 1, 1);
            const lastDay = new Date(year, month, 0);
            const daysInMonth = lastDay.getDate();
            
            // Get day of week (0 = Sunday)
            let firstDayOfWeek = firstDay.getDay();
            
            // Create empty cells for days before first day of month
            for (let i = 0; i < firstDayOfWeek; i++) {
                const cell = document.createElement('div');
                cell.className = 'border-r border-b border-gray-200 bg-gray-50 min-h-[120px] p-1';
                calendarGrid.appendChild(cell);
            }
            
            // Create cells for each day in month
            for (let day = 1; day <= daysInMonth; day++) {
                const cell = document.createElement('div');
                
                // Format date string to match backend format (YYYY-MM-DD)
                const dateString = `${year}-${String(month).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                const isToday = dateString === today;
                
                cell.className = 'border-r border-b border-gray-200 min-h-[120px] p-1 overflow-y-auto relative';
                
                // Mark current day with blue outline
                if (isToday) {
                    cell.classList.add('border-blue-500', 'border-t-2', 'border-l-2');
                }
                
                // Day header (date number)
                const dayHeader = document.createElement('div');
                dayHeader.className = `text-right font-medium py-1 px-2 ${isToday ? 'text-blue-600' : 'text-gray-700'}`;
                dayHeader.textContent = day;
                cell.appendChild(dayHeader);
                
                // Add tasks for this day if any                if (calendarTasks[dateString]) {
                    const tasks = calendarTasks[dateString];
                    const tasksContainer = document.createElement('div');
                    tasksContainer.className = 'space-y-1 px-1';
                    
                    tasks.forEach(task => {
                        const taskElement = document.createElement('div');
                        
                        // Check if this is a special task like "FINAL_PROJECT"
                        const isSpecialTask = task.title && task.title.includes("FINAL_PROJECT");
                        
                        if (isSpecialTask) {
                            // Create styled task with document icon (like in image 2)
                            taskElement.className = 'flex items-center border border-purple-200 rounded-md px-2 py-1 mb-1 bg-white';
                            
                            // Create icon
                            const iconSpan = document.createElement('span');
                            iconSpan.className = 'mr-1 text-purple-400';
                            iconSpan.innerHTML = `
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor">
                                    <path fill-rule="evenodd" d="M4 4a2 2 0 012-2h4.586A2 2 0 0112 2.586L15.414 6A2 2 0 0116 7.414V16a2 2 0 01-2 2H6a2 2 0 01-2-2V4z" clip-rule="evenodd" />
                                </svg>
                            `;
                            
                            // Create text element
                            const textSpan = document.createElement('span');
                            textSpan.className = 'text-xs text-purple-800';
                            textSpan.textContent = task.title;
                            
                            taskElement.appendChild(iconSpan);
                            taskElement.appendChild(textSpan);
                        } else {
                            // Regular task - simple text style like in image 1
                            taskElement.className = 'text-xs mb-1';
                            
                            // Time indicator if available
                            let taskText = task.title;
                            if (task.due_time) {
                                const timeDisplay = formatTime(task.due_time);
                                taskText = `${timeDisplay} - ${task.title}`;
                            }
                            
                            taskElement.textContent = taskText;
                        }                        taskElement.setAttribute('data-task-id', task.id);
                        taskElement.setAttribute('data-task-title', task.title);
                        taskElement.setAttribute('data-task-description', task.description);
                        taskElement.setAttribute('data-task-completed', task.completed);
                        taskElement.setAttribute('data-task-time', task.due_time || '');
                        taskElement.setAttribute('data-task-date', dateString);
                        
                        // Add click event to show task details
                        taskElement.addEventListener('click', showTaskDetail);
                        
                        tasksContainer.appendChild(taskElement);
                    });
                    
                    cell.appendChild(tasksContainer);
                }
                
                calendarGrid.appendChild(cell);
            }
            
            // Fill remaining grid cells for days after the month ends
            const totalCellsCreated = firstDayOfWeek + daysInMonth;
            const remainingCells = 42 - totalCellsCreated; // 6 rows of 7 days
            
            for (let i = 0; i < remainingCells; i++) {
                const cell = document.createElement('div');
                cell.className = 'border-r border-b border-gray-200 bg-gray-50 min-h-[120px] p-1';
                calendarGrid.appendChild(cell);
            }
        }
        
        // Format time from 24h to 12h
        function formatTime(time24h) {
            if (!time24h) return '';
            
            const [hours, minutes] = time24h.split(':');
            const hour = parseInt(hours, 10);
            const period = hour >= 12 ? 'PM' : 'AM';
            const hour12 = hour % 12 || 12;
            
            return `${hour12}:${minutes} ${period}`;
        }
        
        // Show task detail modal
        function showTaskDetail(event) {
            const task = event.target;
            const taskId = task.getAttribute('data-task-id');
            const title = task.getAttribute('data-task-title');
            const description = task.getAttribute('data-task-description');
            const completed = task.getAttribute('data-task-completed') === 'true';
            const time = task.getAttribute('data-task-time');
            const date = task.getAttribute('data-task-date');
            
            document.getElementById('task-detail-title').textContent = title;
            document.getElementById('task-detail-description').textContent = description || 'No description';
            
            // Format the date and time
            const displayDate = new Date(date);
            const dateOptions = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            const dateDisplay = displayDate.toLocaleDateString('en-US', dateOptions);
            
            let timeDisplay = '';
            if (time) {
                timeDisplay = ` at ${formatTime(time)}`;
            }
            
            document.getElementById('task-detail-time').textContent = `Due on ${dateDisplay}${timeDisplay}`;
            
            // Show status
            const statusEl = document.getElementById('task-detail-status');
            statusEl.innerHTML = '';
            const badge = document.createElement('span');
            badge.className = completed ? 
                'inline-block px-2 py-1 text-xs bg-green-100 text-green-800 rounded-full' : 
                'inline-block px-2 py-1 text-xs bg-yellow-100 text-yellow-800 rounded-full';
            badge.textContent = completed ? 'Completed' : 'Pending';
            statusEl.appendChild(badge);
            
            // Set up edit button to open task modal
            document.getElementById('edit-task-detail').addEventListener('click', function() {
                // Assuming you have a task modal as in the listAll.html page
                const taskModal = document.getElementById('task_modal');
                if (taskModal) {
                    // Fill task modal with task data
                    document.getElementById('task_id').value = taskId;
                    // Other fields would need to be set here...
                    // Show modal
                    taskModal.classList.remove('hidden');
                } else {
                    // Fallback - redirect to tasks page
                    window.location.href = "{% url 'theme:tasks' %}";
                }
            }, {once: true});
            
            // Show modal
            taskDetailModal.classList.remove('hidden');
        }
        
        // Close task detail modal
        closeTaskDetailBtn.addEventListener('click', function() {
            taskDetailModal.classList.add('hidden');
        });
        
        // Outside click to close modal
        taskDetailModal.addEventListener('click', function(event) {
            if (event.target === taskDetailModal) {
                taskDetailModal.classList.add('hidden');
            }
        });
          // Navigate to previous month
        prevMonthBtn.addEventListener('click', function() {
            currentMonth--;
            if (currentMonth < 1) {
                currentMonth = 12;
                currentYear--;
            }
            renderCalendar(currentMonth, currentYear);
        });
        
        // Navigate to next month
        nextMonthBtn.addEventListener('click', function() {
            currentMonth++;
            if (currentMonth > 12) {
                currentMonth = 1;
                currentYear++;
            }
            renderCalendar(currentMonth, currentYear);
        });
        
        // Mini calendar navigation
        const miniPrevMonthBtn = document.getElementById('mini-prev-month');
        const miniNextMonthBtn = document.getElementById('mini-next-month');
        
        if (miniPrevMonthBtn) {
            miniPrevMonthBtn.addEventListener('click', function() {
                currentMonth--;
                if (currentMonth < 1) {
                    currentMonth = 12;
                    currentYear--;
                }
                renderCalendar(currentMonth, currentYear);
            });
        }
        
        if (miniNextMonthBtn) {
            miniNextMonthBtn.addEventListener('click', function() {
                currentMonth++;
                if (currentMonth > 12) {
                    currentMonth = 1;
                    currentYear++;
                }
                renderCalendar(currentMonth, currentYear);
            });
        }
        
        // Calendar feed link
        const calendarFeedLink = document.getElementById('calendar-feed-link');
        if (calendarFeedLink) {
            calendarFeedLink.addEventListener('click', function(e) {
                e.preventDefault();
                alert("Calendar feed functionality will be implemented soon!");
            });
        }
        
        // Go to today
        todayBtn.addEventListener('click', function() {
            const now = new Date();
            currentMonth = now.getMonth() + 1;
            currentYear = now.getFullYear();
            renderCalendar(currentMonth, currentYear);
        });
        
        // Initialize sidebar
        initializeCalendarSidebar();
        
        // Initial render
        renderCalendar(currentMonth, currentYear);
    });
</script>
{% endblock %}
