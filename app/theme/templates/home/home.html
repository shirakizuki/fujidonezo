{% extends '../base.html' %}
{% load static %}
{% load tailwind_tags %}
{% block content %}
<div class="w-full flex flex-col h-screen md:flex-row md:p-4">
    <!-- Mobile Sidebar Toggle -->
    <div class="w-full flex flex-row md:hidden p-2 border-b border-gray-200 bg-white shadow-sm">
        <button id="sidebarToggle" class="p-2 bg-orange-200 rounded-md hover:bg-orange-300 transition-colors duration-200 active:scale-95 flex items-center gap-2">
            <svg data-slot="icon" fill="none" stroke-width="1.5" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" class="w-6 h-6">
                <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5"></path>
            </svg>
            <span class="font-medium text-orange-600">Menu</span>
        </button>
    </div>
    
    <!-- Mobile Backdrop -->
    <div id="backdrop" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-40 hidden md:hidden"></div>
      <!-- Sidebar -->
    <div id="sidebar" class="fixed z-50 top-0 left-0 h-full w-3/4 max-w-xs sm:max-w-sm bg-orange-100 -translate-x-full md:translate-x-0 transition-transform duration-300 ease-in-out md:relative md:w-81 flex flex-col md:rounded-2xl shadow-lg overflow-y-auto">
        <!-- Close Button (Mobile Only) -->
        <div class="flex flex-col gap-2 p-3 md:py-8 md:px-4 h-full">
            <div class="flex flex-row justify-between">
                <h1 class="text-neutral-950 text-2xl font-bold">Menu</h1>
                <button id="closeSidebar" class="md:hidden text-lg font-bold px-3 py-1 rounded-full bg-orange-200">
                    <svg data-slot="icon" fill="none" stroke-width="1.5" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" class="w-6 h-6">
                        <path stroke-linecap="round" stroke-linejoin="round" d="m9.75 9.75 4.5 4.5m0-4.5-4.5 4.5M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z"></path>
                    </svg>
                </button>
            </div>
            <a href="#" class="flex items-center gap-2 font-sans">
                <img src="{{ user.profile.avatar }}" alt="Logo" class="w-12 rounded">
                <span class="text-sm md:text-xl ">{{ user.first_name }}</span>
            </a>
            <div class="relative flex py-2 items-center">
                <div class="flex-grow border-t border-neutral-950"></div>
                <span class="flex-shrink mx-4 text-neutral-950 font-bold">Tasks</span>
                <div class="flex-grow border-t border-neutral-950"></div>
            </div>
            <a href="{% url 'theme:tasks' %}" class="px-4 py-1 rounded-md flex items-center gap-2 font-sans hover:font-medium hover:bg-orange-200 transition-color duration-100 ease-in-out {% if request.resolver_match.url_name == 'tasks' %}font-bold bg-orange-400 text-white{% endif %}">
                <svg data-slot="icon" fill="none" stroke-width="1.5" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" class="w-6 h-6">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 12h16.5m-16.5 3.75h16.5M3.75 19.5h16.5M5.625 4.5h12.75a1.875 1.875 0 0 1 0 3.75H5.625a1.875 1.875 0 0 1 0-3.75Z"></path>
                </svg>
                <span class="text-md">All Tasks</span>
            </a>
            <a href="{% url 'theme:labels' %}" class="px-4 py-1 rounded-md flex items-center gap-2 font-sans hover:font-medium hover:bg-orange-200 transition-color duration-100 ease-in-out {% if request.resolver_match.url_name == 'labels' %}font-bold bg-orange-400 text-white{% endif %}">
                <svg data-slot="icon" fill="none" stroke-width="1.5" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" class="w-6 h-6">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M9.568 3H5.25A2.25 2.25 0 0 0 3 5.25v4.318c0 .597.237 1.17.659 1.591l9.581 9.581c.699.699 1.78.872 2.607.33a18.095 18.095 0 0 0 5.223-5.223c.542-.827.369-1.908-.33-2.607L11.16 3.66A2.25 2.25 0 0 0 9.568 3Z"></path>
                    <path stroke-linecap="round" stroke-linejoin="round" d="M6 6h.008v.008H6V6Z"></path>
                </svg>
                <span class="text-md">Labels</span>
            </a>
            <a href="{% url 'theme:calendar' %}" class="px-4 py-1 rounded-md flex items-center gap-2 font-sans hover:font-medium hover:bg-orange-200 transition-color duration-100 ease-in-out {% if request.resolver_match.url_name == 'calendar' %}font-bold bg-orange-400 text-white{% endif %}">
                <svg data-slot="icon" fill="none" stroke-width="1.5" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" class="w-6 h-6">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M6.75 3v2.25M17.25 3v2.25M3 18.75V7.5a2.25 2.25 0 0 1 2.25-2.25h13.5A2.25 2.25 0 0 1 21 7.5v11.25m-18 0A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75m-18 0v-7.5A2.25 2.25 0 0 1 5.25 9h13.5A2.25 2.25 0 0 1 21 11.25v7.5m-9-6h.008v.008H12v-.008ZM12 15h.008v.008H12V15Zm0 2.25h.008v.008H12v-.008ZM9.75 15h.008v.008H9.75V15Zm0 2.25h.008v.008H9.75v-.008ZM7.5 15h.008v.008H7.5V15Zm0 2.25h.008v.008H7.5v-.008Zm6.75-4.5h.008v.008h-.008v-.008Zm0 2.25h.008v.008h-.008V15Zm0 2.25h.008v.008h-.008v-.008Zm2.25-4.5h.008v.008H16.5v-.008Zm0 2.25h.008v.008H16.5V15Z"></path>
                </svg>
                <span class="text-md">Calendar</span>
            </a>
            <div class="relative flex py-2 items-center">
                <div class="flex-grow border-t border-neutral-950"></div>
                <span class="flex-shrink mx-4 text-neutral-950 font-bold">Misc</span>
                <div class="flex-grow border-t border-neutral-950"></div>
            </div>
            <a href="{% url 'theme:help' %}" class="px-4 py-1 rounded-md flex items-center gap-2 font-sans hover:font-medium hover:bg-orange-200 {% if request.resolver_match.url_name == 'help' %}font-bold bg-orange-400 text-white{% endif %}">
                <svg data-slot="icon" fill="none" stroke-width="1.5" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" class="w-6 h-6">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M9.879 7.519c1.171-1.025 3.071-1.025 4.242 0 1.172 1.025 1.172 2.687 0 3.712-.203.179-.43.326-.67.442-.745.361-1.45.999-1.45 1.827v.75M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Zm-9 5.25h.008v.008H12v-.008Z"></path>
                </svg>
                <span class="text-md">Help</span>
            </a>            <!-- Spacer to push logout to bottom -->
            <div class="flex-grow"></div>
            <!-- Logout Button -->
            <a id="logoutButton" class="mt-auto px-4 py-2 rounded-md flex items-center gap-2 font-sans hover:font-medium hover:bg-red-200 transition-colors duration-200 text-red-700 cursor-pointer">
                <svg data-slot="icon" fill="none" stroke-width="1.5" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" class="w-6 h-6">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0 0 13.5 3h-6a2.25 2.25 0 0 0-2.25 2.25v13.5A2.25 2.25 0 0 0 7.5 21h6a2.25 2.25 0 0 0 2.25-2.25V15m3 0 3-3m0 0-3-3m3 3H9"></path>
                </svg>
                <span class="text-md font-medium">Logout</span>
            </a>
        </div>
    </div>
      <!-- Main Content -->
    <main class="w-screen flex flex-row justify-between">
        {% block main %}
        {% endblock %}
    </main>        <!-- Logout Confirmation Modal -->
    <div id="logoutModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 hidden items-center justify-center">
        <div class="bg-white rounded-lg shadow-md w-full max-w-xs mx-4 transform transition-all duration-300">
            <div class="px-5 py-4">
                <h3 class="text-base font-medium text-gray-800">Confirm Logout</h3>
                <p class="mt-1 text-sm text-gray-600">Are you sure you want to log out?</p>
                <div class="mt-4 flex justify-end gap-2">
                    <button id="cancelLogout" class="px-4 py-1.5 bg-gray-50 hover:bg-gray-100 border border-gray-200 rounded text-sm font-medium transition-colors duration-200">Cancel</button>
                    <a href="{% url 'theme:logout' %}" class="px-4 py-1.5 bg-orange-500 hover:bg-orange-600 text-white rounded text-sm font-medium transition-colors duration-200">Log Out</a>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const sidebar = document.getElementById('sidebar');
            const toggle = document.getElementById('sidebarToggle');
            const close = document.getElementById('closeSidebar');
            const backdrop = document.getElementById('backdrop');
            const sidebarLinks = document.querySelectorAll('#sidebar a');
            const logoutButton = document.getElementById('logoutButton');
            const logoutModal = document.getElementById('logoutModal');
            const cancelLogout = document.getElementById('cancelLogout');
            
            // Function to open sidebar
            const openSidebar = () => {
                sidebar.classList.remove('-translate-x-full');
                backdrop.classList.remove('hidden');
                document.body.classList.add('overflow-hidden', 'md:overflow-auto'); // Prevent scrolling on mobile when sidebar is open
            };
            
            // Function to close sidebar
            const closeSidebar = () => {
                sidebar.classList.add('-translate-x-full');
                backdrop.classList.add('hidden');
                document.body.classList.remove('overflow-hidden', 'md:overflow-auto');
            };
            
            // Close sidebar on mobile when window is resized to desktop view
            window.addEventListener('resize', () => {
                if (window.innerWidth >= 768) { // 768px is Tailwind's md breakpoint
                    document.body.classList.remove('overflow-hidden');
                }
            });
            
            // Event listeners
            toggle.addEventListener('click', openSidebar);
            
            close.addEventListener('click', closeSidebar);
            
            backdrop.addEventListener('click', closeSidebar);
            
            // Close sidebar when a link is clicked (mobile only)
            sidebarLinks.forEach(link => {
                link.addEventListener('click', () => {
                    if (window.innerWidth < 768) {
                        closeSidebar();
                    }
                });
            });
            
            // Handle ESC key to close sidebar
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && !sidebar.classList.contains('-translate-x-full')) {
                    closeSidebar();
                }
                
                // Also close logout modal on Escape key
                if (e.key === 'Escape' && !logoutModal.classList.contains('hidden')) {
                    logoutModal.classList.add('hidden');
                }
            });

            // Open logout modal
            logoutButton.addEventListener('click', () => {
                logoutModal.classList.remove('hidden');
                logoutModal.classList.add('flex');
            });

            // Close logout modal
            cancelLogout.addEventListener('click', () => {
                logoutModal.classList.add('hidden');
                logoutModal.classList.remove('flex');
            });
            
            // Close modal when clicking outside
            logoutModal.addEventListener('click', (e) => {
                if (e.target === logoutModal) {
                    logoutModal.classList.add('hidden');
                    logoutModal.classList.remove('flex');
                }
            });
        });
    </script>
</div>
{% endblock %}
