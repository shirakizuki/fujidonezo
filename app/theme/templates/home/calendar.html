{% extends './home.html' %}
{% load static %}
{% load tailwind_tags %}
{% block main %}
<div class="w-full p-3 md:px-4 md:py-5 lg:px-6 lg:py-6 overflow-y-auto">
    <div class="flex flex-row justify-between items-center mb-6">
        <div class="flex items-center space-x-4">
            <h1 class="text-2xl font-bold" id="calendar-header">Calendar</h1>
            <div class="flex space-x-2">
                <button id="prev-month" class="p-2 bg-gray-100 hover:bg-gray-200 rounded-md">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd" d="M12.707 5.293a1 1 0 010 1.414L9.414 10l3.293 3.293a1 1 0 01-1.414 1.414l-4-4a1 1 0 010-1.414l4-4a1 1 0 011.414 0z" clip-rule="evenodd" />
                    </svg>
                </button>
                <button id="today-btn" class="px-3 py-1 bg-orange-200 hover:bg-orange-300 rounded-md text-sm">Today</button>
                <button id="next-month" class="p-2 bg-gray-100 hover:bg-gray-200 rounded-md">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd" d="M7.293 14.707a1 1 0 010-1.414L10.586 10 7.293 6.707a1 1 0 011.414-1.414l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0z" clip-rule="evenodd" />
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <!-- Calendar container -->
    <div class="bg-white rounded-lg shadow-md">
        <!-- Weekday headers -->
        <div class="grid grid-cols-7 border-b text-center py-2 font-medium text-gray-500">
            <div>MON</div>
            <div>TUE</div>
            <div>WED</div>
            <div>THU</div>
            <div>FRI</div>
            <div>SAT</div>
            <div>SUN</div>
        </div>
        
        <!-- Calendar grid -->
        <div id="calendar-grid" class="grid grid-cols-7 auto-rows-fr">
            <!-- Calendar cells will be generated by JavaScript -->
        </div>
    </div>

    <!-- Task detail modal -->
    <div id="task-detail-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center">
        <div class="bg-white rounded-lg shadow-xl w-full max-w-md mx-4 overflow-hidden">
            <div class="p-4 border-b">
                <h3 id="task-detail-title" class="text-lg font-semibold"></h3>
            </div>
            <div class="p-4 space-y-3">
                <div id="task-detail-time" class="text-sm text-gray-500"></div>
                <p id="task-detail-description" class="text-gray-700"></p>
                <div id="task-detail-status" class="mt-4"></div>
            </div>
            <div class="p-4 bg-gray-50 flex justify-end space-x-2">
                <button id="close-task-detail" class="px-4 py-2 bg-gray-200 hover:bg-gray-300 rounded-md">Close</button>
                <button id="edit-task-detail" class="px-4 py-2 bg-orange-400 hover:bg-orange-500 text-white rounded-md">Edit</button>
            </div>
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        // Calendar data from backend
        const calendarTasks = {{ calendar_tasks|safe }};
        const today = "{{ today }}";
        let currentMonth = {{ current_month }};
        let currentYear = {{ current_year }};
        
        // DOM elements
        const calendarGrid = document.getElementById('calendar-grid');
        const calendarHeader = document.getElementById('calendar-header');
        const prevMonthBtn = document.getElementById('prev-month');
        const nextMonthBtn = document.getElementById('next-month');
        const todayBtn = document.getElementById('today-btn');
        const taskDetailModal = document.getElementById('task-detail-modal');
        const closeTaskDetailBtn = document.getElementById('close-task-detail');
        
        // Month names for header
        const monthNames = ["January", "February", "March", "April", "May", "June",
                           "July", "August", "September", "October", "November", "December"];
        
        // Generate and render calendar
        function renderCalendar(month, year) {
            // Clear the grid
            calendarGrid.innerHTML = '';
            
            // Update the header
            calendarHeader.textContent = `${monthNames[month - 1]} ${year}`;
            
            // Get first day of month and last day
            const firstDay = new Date(year, month - 1, 1);
            const lastDay = new Date(year, month, 0);
            const daysInMonth = lastDay.getDate();
            
            // Get day of week for first day of month (0 = Sunday, 1 = Monday, etc.)
            // Adjust for Monday as first day of week
            let firstDayOfWeek = firstDay.getDay() - 1; 
            if (firstDayOfWeek < 0) firstDayOfWeek = 6; // Sunday becomes 6
            
            // Create empty cells for days before first day of month
            for (let i = 0; i < firstDayOfWeek; i++) {
                const cell = document.createElement('div');
                cell.className = 'border border-gray-100 h-32 min-h-[8rem] bg-gray-50 p-1';
                calendarGrid.appendChild(cell);
            }
            
            // Create cells for each day in month
            for (let day = 1; day <= daysInMonth; day++) {
                const cell = document.createElement('div');
                
                // Format date string to match backend format (YYYY-MM-DD)
                const dateString = `${year}-${String(month).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                const isToday = dateString === today;
                
                cell.className = 'border border-gray-100 h-32 min-h-[8rem] p-1 overflow-y-auto';
                
                // Mark current day with orange background
                if (isToday) {
                    cell.classList.add('bg-orange-50');
                }
                
                // Day header (date number)
                const dayHeader = document.createElement('div');
                dayHeader.className = `text-sm font-medium mb-1 ${isToday ? 'text-orange-600' : 'text-gray-700'}`;
                dayHeader.textContent = day;
                cell.appendChild(dayHeader);
                
                // Add tasks for this day if any
                if (calendarTasks[dateString]) {
                    const tasks = calendarTasks[dateString];
                    tasks.forEach(task => {
                        const taskElement = document.createElement('div');
                        taskElement.className = `p-1 mb-1 text-xs rounded-md cursor-pointer ${task.completed ? 'bg-gray-100 text-gray-500 line-through' : 'bg-orange-100 text-orange-800'}`;
                        
                        // Time indicator if available
                        let taskText = task.title;
                        if (task.due_time) {
                            const timeDisplay = formatTime(task.due_time);
                            taskText = `${timeDisplay} - ${task.title}`;
                        }
                        
                        taskElement.textContent = taskText;
                        taskElement.setAttribute('data-task-id', task.id);
                        taskElement.setAttribute('data-task-title', task.title);
                        taskElement.setAttribute('data-task-description', task.description);
                        taskElement.setAttribute('data-task-completed', task.completed);
                        taskElement.setAttribute('data-task-time', task.due_time || '');
                        taskElement.setAttribute('data-task-date', dateString);
                        
                        // Add click event to show task details
                        taskElement.addEventListener('click', showTaskDetail);
                        
                        cell.appendChild(taskElement);
                    });
                }
                
                calendarGrid.appendChild(cell);
            }
            
            // Fill remaining grid cells for days after the month ends
            const totalCellsCreated = firstDayOfWeek + daysInMonth;
            const remainingCells = 42 - totalCellsCreated; // 6 rows of 7 days
            
            for (let i = 0; i < remainingCells; i++) {
                const cell = document.createElement('div');
                cell.className = 'border border-gray-100 h-32 min-h-[8rem] bg-gray-50 p-1';
                calendarGrid.appendChild(cell);
            }
        }
        
        // Format time from 24h to 12h
        function formatTime(time24h) {
            if (!time24h) return '';
            
            const [hours, minutes] = time24h.split(':');
            const hour = parseInt(hours, 10);
            const period = hour >= 12 ? 'PM' : 'AM';
            const hour12 = hour % 12 || 12;
            
            return `${hour12}:${minutes} ${period}`;
        }
        
        // Show task detail modal
        function showTaskDetail(event) {
            const task = event.target;
            const taskId = task.getAttribute('data-task-id');
            const title = task.getAttribute('data-task-title');
            const description = task.getAttribute('data-task-description');
            const completed = task.getAttribute('data-task-completed') === 'true';
            const time = task.getAttribute('data-task-time');
            const date = task.getAttribute('data-task-date');
            
            document.getElementById('task-detail-title').textContent = title;
            document.getElementById('task-detail-description').textContent = description || 'No description';
            
            // Format the date and time
            const displayDate = new Date(date);
            const dateOptions = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            const dateDisplay = displayDate.toLocaleDateString('en-US', dateOptions);
            
            let timeDisplay = '';
            if (time) {
                timeDisplay = ` at ${formatTime(time)}`;
            }
            
            document.getElementById('task-detail-time').textContent = `Due on ${dateDisplay}${timeDisplay}`;
            
            // Show status
            const statusEl = document.getElementById('task-detail-status');
            statusEl.innerHTML = '';
            const badge = document.createElement('span');
            badge.className = completed ? 
                'inline-block px-2 py-1 text-xs bg-green-100 text-green-800 rounded-full' : 
                'inline-block px-2 py-1 text-xs bg-yellow-100 text-yellow-800 rounded-full';
            badge.textContent = completed ? 'Completed' : 'Pending';
            statusEl.appendChild(badge);
            
            // Set up edit button to open task modal
            document.getElementById('edit-task-detail').addEventListener('click', function() {
                // Assuming you have a task modal as in the listAll.html page
                const taskModal = document.getElementById('task_modal');
                if (taskModal) {
                    // Fill task modal with task data
                    document.getElementById('task_id').value = taskId;
                    // Other fields would need to be set here...
                    // Show modal
                    taskModal.classList.remove('hidden');
                } else {
                    // Fallback - redirect to tasks page
                    window.location.href = "{% url 'theme:tasks' %}";
                }
            }, {once: true});
            
            // Show modal
            taskDetailModal.classList.remove('hidden');
        }
        
        // Close task detail modal
        closeTaskDetailBtn.addEventListener('click', function() {
            taskDetailModal.classList.add('hidden');
        });
        
        // Outside click to close modal
        taskDetailModal.addEventListener('click', function(event) {
            if (event.target === taskDetailModal) {
                taskDetailModal.classList.add('hidden');
            }
        });
        
        // Navigate to previous month
        prevMonthBtn.addEventListener('click', function() {
            currentMonth--;
            if (currentMonth < 1) {
                currentMonth = 12;
                currentYear--;
            }
            renderCalendar(currentMonth, currentYear);
        });
        
        // Navigate to next month
        nextMonthBtn.addEventListener('click', function() {
            currentMonth++;
            if (currentMonth > 12) {
                currentMonth = 1;
                currentYear++;
            }
            renderCalendar(currentMonth, currentYear);
        });
        
        // Go to today
        todayBtn.addEventListener('click', function() {
            const now = new Date();
            currentMonth = now.getMonth() + 1;
            currentYear = now.getFullYear();
            renderCalendar(currentMonth, currentYear);
        });
        
        // Initial render
        renderCalendar(currentMonth, currentYear);
    });
</script>
{% endblock %}
