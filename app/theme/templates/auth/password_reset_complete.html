{% extends '../base.html' %}
{% load static %}

{% block content %}
<div class="flex items-center justify-center h-screen bg-gray-50">
    <div class="max-w-md w-full p-8 bg-white rounded-lg shadow-lg">
        <div class="text-center">
            <div class="mb-6 text-green-500">
                <svg xmlns="http://www.w3.org/2000/svg" class="mx-auto h-16 w-16" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
            </div>
            <h2 class="text-2xl font-bold text-gray-800 mb-4">Password Reset Successfully</h2>
            <p class="text-gray-600 mb-6">Your password has been changed successfully. You can now use your new password to log in.</p>
            <a href="{% url 'theme:login' %}" class="inline-block px-6 py-3 bg-orange-400 text-white rounded-md hover:bg-orange-500 transition duration-300 cursor-pointer font-medium">
                Go to Login
            </a>
        </div>
    </div>
</div>
{% endblock %}
